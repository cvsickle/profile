# Sync this repository to a Codeberg mirror
when:
  - event: push
    branch: '*'
  - event: manual
  - event: cron
    cron: "25 */6 * * *"

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

steps:
  - name: sync-to-codeberg
    image: alpine/git
    environment:
      CODEBERG_BASE_URL: "https://codeberg.org/cvsickle"
      CODEBERG_REPO: "profile"
      CODEBERG_USERNAME: "cvsickle"
      CODEBERG_TOKEN:
        from_secret: codeberg_token
      GITHUB_PULL_TOKEN:
        from_secret: github_pull_token
    commands:
      - set -e
      # the clone step's GitHub credentials don't carry over to this container,
      # so re-authenticate the origin remote before fetching from it
      - git remote set-url origin "https://x-access-token:$GITHUB_PULL_TOKEN@github.com/$CI_REPO_OWNER/$CI_REPO_NAME.git"
      # make sure we fetch every branch and tag, not just the one that triggered the build
      - git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - git fetch origin '+refs/tags/*:refs/tags/*'
      # normalize the base URL and build the push URL with embedded credentials.
      # bash's %/ and #http(s):// trims require braces, so those must be $$-escaped.
      - BASE_URL="$CODEBERG_BASE_URL"
      - BASE_URL="$${BASE_URL%/}"
      - HOST="$${BASE_URL#http://}"
      - HOST="$${HOST#https://}"
      - git push --mirror "https://$CODEBERG_USERNAME:$CODEBERG_TOKEN@$HOST/$CODEBERG_REPO.git"

  - name: failure-check
    image: alpine:3.20
    when:
      - status: failure
    environment:
      CODEBERG_BASE_URL: "https://codeberg.org/cvsickle"
      CODEBERG_REPO: "profile"
      CODEBERG_USERNAME: "cvsickle"
      CODEBERG_TOKEN:
        from_secret: codeberg_token
      GITHUB_PULL_TOKEN:
        from_secret: github_pull_token
    commands:
      - set +e
      - echo "Workflow failed, printing debug information..."
      - echo ""
      - echo "=== Provided values ==="
      - echo " CODEBERG_BASE_URL is $${CODEBERG_BASE_URL}"
      - echo " CODEBERG_REPO is $${CODEBERG_REPO}"
      - echo " CODEBERG_USERNAME is $${CODEBERG_USERNAME}"
      - echo " CODEBERG_TOKEN length is $${#CODEBERG_TOKEN}"
      - echo " GITHUB_PULL_TOKEN length is $${#GITHUB_PULL_TOKEN}"
      - echo ""
      - echo "=== Git diagnostics ==="
      - git remote -v || echo "Failed to list git remotes"
      - git log --oneline -5 || echo "Failed to show git log"
      - echo ""
      - echo "=== Network diagnostics ==="
      - ping -c 1 codeberg.org || echo "Failed to ping codeberg.org"
      - echo ""
      - echo "=== Disk and system info ==="
      - df -h || echo "Failed to show disk space"
      - echo "Home directory contents:" && ls -la ~/ || echo "Failed to list home directory"