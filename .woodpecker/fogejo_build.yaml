# Build and push Docker image on release
when:
  - event: release
  - event: manual

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:latest
    settings:
      destinations:
        - "git.cvsickle.com/cvsickle/profile:latest"
        - "git.cvsickle.com/cvsickle/profile:${CI_COMMIT_TAG}"
      docker_config_json:
        from_secret: forgejo_config_json
      dockerfile: Dockerfile
      context: .
