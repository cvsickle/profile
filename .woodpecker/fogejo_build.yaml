# Build and push Docker image on release
when:
  - event: release

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 0
      tags: true

steps:
  - name: build-and-push
    image: woodpeckerci/plugin-kaniko:latest
    settings:
      registry: git.cvsickle.com
      repo: cvsickle/profile
      username: cvsickle
      password:
        from_secret: forgejo_token
      tags:
        - latest
        - ${CI_COMMIT_TAG}
      dockerfile: Dockerfile
      context: .
